<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>22 años juntos ♥</title>
<meta name="theme-color" content="#2a0a14">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2a0a14; --bg2:#4a1024; --gold:#f6c9d3; --soft:#e8a0b4; --paper:#fbf3e6; --ink:#4a2a2a; --accent:#a02f52;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%) fixed;color:var(--paper);
    font-family:'Cormorant Garamond',Georgia,serif;min-height:100%}
  body.locked{overflow:hidden;height:100vh}
  .script{font-family:'Great Vibes',cursive;font-weight:400}

  /* ---------- Corazones flotando ---------- */
  .heart{position:fixed;bottom:-30px;pointer-events:none;opacity:0;z-index:1;animation:rise linear forwards}
  @keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.8}100%{opacity:0;transform:translateY(-110vh) scale(1.2) rotate(25deg)}}

  /* ---------- Intro: sobre ---------- */
  #intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,var(--bg2),var(--bg) 75%);transition:opacity 1.2s ease,visibility 1.2s}
  #intro.gone{opacity:0;visibility:hidden}
  #intro h1{font-size:clamp(2.4rem,9vw,3.6rem);color:var(--gold);margin-bottom:.4rem;text-align:center;padding:0 1rem}
  #intro p.hint{font-style:italic;color:var(--soft);margin-top:2.2rem;letter-spacing:.08em;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}

  .envelope{position:relative;width:min(78vw,340px);aspect-ratio:1.5;margin-top:2rem;cursor:pointer;perspective:900px}
  .env-back,.env-front,.env-flap,.env-letter{position:absolute;left:0;right:0}
  .env-back{inset:0;background:#7a1f3d;border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.55)}
  .env-letter{left:6%;right:6%;top:6%;height:88%;background:var(--paper);border-radius:4px;transition:transform 1s ease .5s;
    display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:1.7rem;text-align:center}
  .env-front{inset:0;border-radius:6px;overflow:hidden;pointer-events:none}
  .env-front::before,.env-front::after{content:"";position:absolute;bottom:0;width:100%;height:100%}
  .env-front::before{background:#8f2748;clip-path:polygon(0 0,0 100%,55% 55%)}
  .env-front::after{background:#a02f52;clip-path:polygon(100% 0,100% 100%,45% 55%)}
  .env-bottom{position:absolute;left:0;right:0;bottom:0;height:56%;background:#93264a;clip-path:polygon(0 100%,100% 100%,50% 0)}
  .env-flap{top:0;height:56%;background:#a8305a;transform-origin:top;clip-path:polygon(0 0,100% 0,50% 100%);
    transition:transform .8s ease,z-index 0s .4s;z-index:3;backface-visibility:hidden}
  .seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;z-index:4;
    background:radial-gradient(circle at 35% 30%,#e04b6e,#9c1f3f);color:#fbe3ea;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.5);font-size:1.5rem;transition:opacity .4s}
  .envelope.open .env-flap{transform:rotateX(180deg);z-index:0}
  .envelope.open .seal{opacity:0}
  .envelope.open .env-letter{transform:translateY(-62%)}

  /* ---------- Contenido ---------- */
  main{position:relative;z-index:2;max-width:720px;margin:0 auto;padding:0 1.25rem 6rem}
  section{padding:3.5rem 0 1rem}
  .reveal{opacity:0;transform:translateY(28px);transition:opacity 1.1s ease,transform 1.1s ease}
  .reveal.in{opacity:1;transform:none}

  .title{text-align:center;padding-top:3.5rem}
  .title .small{letter-spacing:.3em;text-transform:uppercase;font-size:.85rem;color:var(--soft)}
  .title h2{font-size:clamp(3.4rem,15vw,5.5rem);color:var(--gold);line-height:1.1;margin:.6rem 0}
  .divider{font-size:1.4rem;letter-spacing:.8rem;color:var(--soft)}

  .letter{background:var(--paper);color:var(--ink);padding:2.4rem 1.7rem;border-radius:6px;
    box-shadow:0 25px 60px rgba(0,0,0,.5);font-size:1.32rem;line-height:1.75;position:relative}
  .letter::before{content:"";position:absolute;inset:8px;border:1px solid rgba(160,47,82,.25);border-radius:3px;pointer-events:none}
  .letter p{margin-bottom:1.25rem}
  .letter .big{font-size:clamp(2.1rem,9vw,2.9rem);color:var(--accent);line-height:1.15;text-align:center;margin-bottom:1.6rem}
  .letter .lead{text-align:center;font-style:italic}
  .letter .strong{font-weight:600}
  .letter .hearts{text-align:center;font-size:1.6rem;margin:1.6rem 0 0;letter-spacing:.6rem;color:var(--accent)}
  .letter .te-amo{font-size:2.6rem;color:var(--accent);text-align:center;margin:1.4rem 0 .2rem;line-height:1.2}
  .letter .sign{font-size:2rem;color:var(--accent);text-align:right;margin:.6rem 0 0}

  .gallery-title{text-align:center;font-size:2.6rem;color:var(--gold);margin-bottom:2rem}
  .photo{margin:0 auto 3rem;background:var(--paper);padding:12px 12px 14px;width:min(92%,440px);
    box-shadow:0 18px 40px rgba(0,0,0,.5);transform:translateY(28px) rotate(var(--r,0deg))}
  .photo:nth-child(odd){--r:-2deg}.photo:nth-child(even){--r:2deg}
  .photo.reveal.in{transform:rotate(var(--r))}
  .photo img{display:block;width:100%;height:auto;min-height:200px;background:#f2d6dd}
  .photo figcaption{color:var(--ink);text-align:center;font-style:italic;font-size:1.25rem;padding-top:.6rem}
  .photo figcaption:empty{display:none}
  .photo .ph{aspect-ratio:4/5;background:linear-gradient(135deg,#f2d6dd,#e8a0b455);display:flex;align-items:center;justify-content:center;font-size:3rem}

  .finale{text-align:center;padding-top:3rem}
  .big22{font-size:clamp(7rem,38vw,12rem);line-height:1;color:var(--gold);text-shadow:0 0 40px rgba(240,140,170,.5)}
  .finale .years{font-size:2.2rem;color:var(--soft);margin-top:-.4rem}
  .finale .names{font-size:2.6rem;color:var(--paper);margin-top:1.6rem}

  /* ---------- Música ---------- */
  #music{position:fixed;right:14px;top:max(14px,env(safe-area-inset-top));z-index:60;width:44px;height:44px;border-radius:50%;
    border:1px solid var(--gold);background:rgba(42,10,20,.7);color:var(--gold);font-size:1.2rem;cursor:pointer;
    backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .8s}
  #music.show{opacity:1;visibility:visible}
</style>
</head>
<body class="locked">

<button id="music" aria-label="Música">♪</button>
<audio id="audio" loop preload="auto"></audio>

<!-- ============ INTRO ============ -->
<div id="intro">
  <h1 class="script" id="introTitle"></h1>
  <div class="envelope" id="envelope" role="button" aria-label="Abrir carta">
    <div class="env-back"></div>
    <div class="env-letter script" id="envText"></div>
    <div class="env-front"></div>
    <div class="env-bottom"></div>
    <div class="env-flap"></div>
    <div class="seal">♥</div>
  </div>
  <p class="hint">Tocá el sobre para abrirlo</p>
</div>

<!-- ============ CONTENIDO ============ -->
<main>
  <section class="title reveal">
    <h2 class="script" id="names"></h2>
    <div class="divider">♥ ♥ ♥</div>
  </section>

  <!-- Carta, parte 1 -->
  <section>
    <div class="letter reveal" id="letter1"></div>
  </section>

  <!-- Galería -->
  <section>
    <h3 class="gallery-title script reveal" id="galleryTitle"></h3>
    <div id="gallery"></div>
  </section>

  <!-- Carta, parte 2 -->
  <section>
    <div class="letter reveal" id="letter2"></div>
  </section>

  <section class="finale reveal">
    <div class="big22 script">22</div>
    <div class="years script">años juntos</div>
  </section>
</main>

<script>
/* =====================================================
   ✏️  EDITÁ SOLO ESTA PARTE
   ===================================================== */
const CONFIG = {
  para: "Gordita",
  de: "Mauricio",
  tituloIntro: "22 años juntos",
  sobre: "Para mi gordita",
  musica: "musica.mp3.mp3",          // subí tu canción al repo con este nombre

  // ----- Carta, parte 1 (antes de las fotos) -----
  parte1: {
    titulo: "HOY CUMPLIMOS 22 AÑOS JUNTOS!",
    parrafos: [
      "Me hace feliz despertarme todos los días a tu lado.",
      "Tantos años, tantas vidas, tantos sueños y tanto amor que vivimos.",
      "Empezamos a los 17, siendo apenas dos chicos con muchas ganas de soñar. Muy jóvenes nos tocó ser papás, y ahí aprendimos que juntos podíamos con todo. Nos animamos a dejar nuestra ciudad para buscar algo mejor, y aunque a veces dio miedo, nunca soltamos la mano del otro. Luchamos, crecimos y lo logramos."
    ],
    invitacion: "Mirá un poco de nuestra hermosa historia..."
  },

  tituloGaleria: "Nuestra historia",

  // ----- Fotos: están en la carpeta /fotos como 01.jpg, 02.jpg ... -----
  cantidadFotos: 34,
  // Pies de foto opcionales: numero de foto -> texto. Ej: { 1: "Cuando éramos chicos" }
  pies: {},

  // ----- Carta, parte 2 (después de las fotos) -----
  parte2: {
    parrafos: [
      "Hoy miro lo que construimos. Giuli y Nacho, nuestra casa llena de respeto y de amor, y entiendo que nada de esto sería posible sin vos.",
      "Gracias por quedarte, por creer en mí y por elegirme todos los días.",
      "Si volviera a nacer, te volvería a elegir mil veces."
    ],
    teAmo: "TE AMO..",
    firma: "Mauricio"
  }
};
/* ===================================================== */

const $ = s => document.querySelector(s);
const P = (t, cls="") => `<p class="reveal ${cls}">${t}</p>`;

// Textos
$("#introTitle").textContent = CONFIG.tituloIntro;
$("#envText").textContent = CONFIG.sobre;
$("#names").textContent = CONFIG.para;
$("#galleryTitle").textContent = CONFIG.tituloGaleria;

$("#letter1").innerHTML =
  `<p class="big script reveal">${CONFIG.parte1.titulo}</p>` +
  CONFIG.parte1.parrafos.map(p => P(p)).join("") +
  P(CONFIG.parte1.invitacion, "lead strong") +
  `<p class="hearts reveal">♥ ♥ ♥</p>`;

$("#letter2").innerHTML =
  CONFIG.parte2.parrafos.map(p => P(p)).join("") +
  `<p class="te-amo script reveal">${CONFIG.parte2.teAmo}</p>` +
  `<p class="sign script reveal">${CONFIG.parte2.firma}</p>`;

// Galería
const gallery = $("#gallery");
for (let n = 1; n <= CONFIG.cantidadFotos; n++){
  const num = String(n).padStart(2,"0");
  const fig = document.createElement("figure");
  fig.className = "photo reveal";
  const img = new Image();
  img.loading = "lazy"; img.alt = "Foto " + n; img.src = `fotos/${num}.jpg`;
  img.onerror = () => { const ph = document.createElement("div"); ph.className = "ph"; ph.textContent = "♥"; img.replaceWith(ph); };
  const cap = document.createElement("figcaption"); cap.textContent = CONFIG.pies[n] || "";
  fig.append(img, cap);
  gallery.append(fig);
}

// Música
const audio = $("#audio"), musicBtn = $("#music");
audio.src = CONFIG.musica; audio.volume = 0.7;
let playing = false;
function setPlaying(v){ playing = v; musicBtn.textContent = v ? "♪" : "✕"; musicBtn.style.opacity = v ? 1 : .6; }
musicBtn.addEventListener("click", () => {
  if (playing){ audio.pause(); setPlaying(false); } else { audio.play().then(()=>setPlaying(true)).catch(()=>{}); }
});

// Corazones flotantes
const HEARTS = ["♥","♥","♡"];
function spawnHeart(){
  const h = document.createElement("div");
  h.className = "heart"; h.textContent = HEARTS[Math.floor(Math.random()*HEARTS.length)];
  h.style.color = Math.random()<.5 ? "#f2a0b5" : "#e04b6e";
  h.style.left = Math.random()*100 + "vw";
  h.style.fontSize = (12 + Math.random()*20) + "px";
  const d = 7 + Math.random()*6;
  h.style.animationDuration = d + "s";
  document.body.append(h);
  setTimeout(() => h.remove(), d*1000);
}
setInterval(spawnHeart, 1000);

// Aparecer al hacer scroll
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.12});
function observeAll(){ document.querySelectorAll(".reveal").forEach(el => io.observe(el)); }

// Abrir sobre
const env = $("#envelope");
let opened = false;
env.addEventListener("click", () => {
  if (opened) return; opened = true;
  env.classList.add("open");
  audio.play().then(()=>setPlaying(true)).catch(()=>setPlaying(false));
  musicBtn.classList.add("show");
  for (let i=0;i<10;i++) setTimeout(spawnHeart, i*120);
  setTimeout(() => {
    $("#intro").classList.add("gone");
    document.body.classList.remove("locked");
    window.scrollTo(0,0);
    observeAll();
  }, 2400);
});
</script>
</body>
</html>
